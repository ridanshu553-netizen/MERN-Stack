<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms in HTML</title>
</head>
<body>
    <h2>Forms in HTML:</h2>
    <form action="">
        <label for="fName">First Name:</label> 
        <input type="text" id="fName" minlength="7" maxlength="100" required/>

        <label for="">Last Name:</label>
        <input type="text" minlength=""7 maxLength="100" required>
        <br> <br>
        <label for="">Age:</label>
        <input type="number">
        
        <br> <br>
        <label for="">Email:</label>
        <input type="email">

        <br> <br>
        <label for="">Date of Joining:</label>
        <input type="date">

        <br> <br>
        <label for="">Password:</label>
        <input type="Password">

        <p>Enter your shirt size:</p>
        <input type="radio" name="shirtsize" id="Medium Size"> <label for="Medium Size">Medium Size</label>
        <input type="radio" name="shirtsize" id="Small Size"> <label for="Small Size">Small Size</label>
        <input type="radio" name="shirtsize"id="Large Size"> <label for="Large Size">Large Size</label>

    </form>
</body>
</html>
